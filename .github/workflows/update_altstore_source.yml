name: Update AltStore Source

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ashura-pages
  cancel-in-progress: true

jobs:
  update-source:
    # Nightlies are published + deployed by nightly.yml; skip duplicate work here.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       github.event.release.tag_name != 'nightly')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update AltStore source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # On manual/stable release events, prefer the event tag when present.
          ASHURA_RELEASE_TAG: ${{ github.event.release.tag_name || 'nightly' }}
        run: |
          python .github/workflows/supporting/update_altstore_json.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/workflows/supporting/altstore

  deploy:
    needs: update-source
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
